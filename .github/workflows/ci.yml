name: Test and package Repair Terminal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests-deb:
    name: Linux tests + Debian package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install OS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk dpkg-dev
      - name: Create build environment
        run: |
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Compile Python source
        run: .venv-ci/bin/python -m compileall -q game main.py scripts tests tools
      - name: Run headless tests
        run: .venv-ci/bin/python -m pytest -q
      - name: Build Debian package
        run: .venv-ci/bin/python scripts/build.py --target deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: repair-terminal-deb
          path: dist/linux/*.deb
          if-no-files-found: error

  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Compile Python source
        run: python -m compileall -q game main.py scripts tests tools
      - name: Run headless tests
        run: python -m pytest -q
      - name: Build Windows executable
        run: python scripts/build.py --target exe
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: repair-terminal-windows-exe
          path: dist/windows/RepairTerminal.exe
          if-no-files-found: error

  linux-flatpak:
    name: Linux Flatpak bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install Flatpak and Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Create build environment
        run: |
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build Flatpak bundle
        run: .venv-ci/bin/python scripts/build.py --target flatpak
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: repair-terminal-flatpak
          path: dist/linux/*.flatpak
          if-no-files-found: error
