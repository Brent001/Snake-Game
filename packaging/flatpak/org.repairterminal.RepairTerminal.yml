app-id: org.repairterminal.RepairTerminal
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: repair-terminal
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-config/repair-terminal:create
modules:
  - name: repair-terminal
    buildsystem: simple
    build-commands:
      - install -Dm755 RepairTerminal /app/bin/repair-terminal
      - install -Dm644 org.repairterminal.RepairTerminal.desktop /app/share/applications/org.repairterminal.RepairTerminal.desktop
      - install -Dm644 repair-terminal.svg /app/share/icons/hicolor/scalable/apps/org.repairterminal.RepairTerminal.svg
    sources:
      - type: dir
        path: ../../build/flatpak-source
      - type: file
        path: org.repairterminal.RepairTerminal.desktop
      - type: file
        path: ../icons/org.repairterminal.RepairTerminal.svg
        dest-filename: repair-terminal.svg
